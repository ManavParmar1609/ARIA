# ARIA runtime configuration.
#
# Secrets never live in this file. Each provider names the environment variable holding its key;
# a provider without a key (or endpoint) is disabled and fallback chains skip it, ending at the
# deterministic `fake` provider so every path still works offline.
#
# Model IDs move quickly. `verified: true` means the default IDs answered live calls on the date
# in the notes; `verified: false` marks IDs not yet checked. `aria providers check` reads each
# provider's catalog, confirms the configured IDs and sends one tiny request.

llm:
  # The adjudicator has no fake fallback: without a real model, the conservative severity policy
  # decides (most severe class in the prediction set, flagged for review).
  # nim-local (a self-hosted NIM) leads every chain; it is skipped until NIM_LOCAL_BASE_URL is set.
  routing:
    adjudicator: [nim-local, nim, nim-fallback, azure, openai_compat]
    investigator: [nim-local, nim, nim-fallback, azure, openai_compat, fake]
    reporter: [nim-local, nim, nim-fallback, azure, openai_compat, fake]
    critic: [nim-local, nim, nim-fallback, azure, openai_compat, fake]
    comms: [nim-local, nim, nim-fallback, azure, openai_compat, fake]
    ask: [nim-local, nim, nim-fallback, azure, openai_compat, fake]
    default: [nim-local, nim, nim-fallback, azure, openai_compat, fake]
  embeddings: [nim, azure, local]
  rerank: [nim]
  safety: [nim]

  providers:
    nim:
      kind: nvidia_nim
      base_url: ${NVIDIA_NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      api_key_env: NVIDIA_API_KEY
      chat_model: ${NVIDIA_NIM_CHAT_MODEL:-openai/gpt-oss-20b}
      reasoning_effort: ${NVIDIA_NIM_REASONING_EFFORT:-low}
      embedding_model: ${NVIDIA_NIM_EMBED_MODEL:-nvidia/nemotron-3.5-embed-1b}
      rerank_model: ${NVIDIA_NIM_RERANK_MODEL:-}
      rerank_url: ${NVIDIA_NIM_RERANK_URL:-}
      safety_model: ${NVIDIA_NIM_SAFETY_MODEL:-nvidia/nemotron-3.5-content-safety}
      structured_output: json_schema
      stream_always: true
      stall_timeout_s: 25
      timeout_s: 90
      verified: true
      notes: >-
        Hosted NVIDIA NIM (build.nvidia.com), OpenAI-compatible. Verified 2026-10-29 with live
        calls: openai/gpt-oss-20b (strict JSON schema, streaming) and nvidia/nemotron-3.5-embed-1b
        (2048-dim, input_type=query|passage). z-ai/glm-5.3-flash is listed but did not answer
        within 100 s that day. nvidia/nemotron-3.5-content-safety (the optional guardrail, off by
        default) is listed in the model catalog (checked 2026-10-29) but has not been called live,
        so its verdict format is unverified. Reranking is off until NVIDIA_NIM_RERANK_MODEL and
        NVIDIA_NIM_RERANK_URL are set (the retrieval API runs on ai.api.nvidia.com). Set
        NVIDIA_NIM_BASE_URL to a self-hosted NIM (for example http://nim:8000/v1) to use your
        own GPUs.

    nim-fallback:
      kind: nvidia_nim
      base_url: ${NVIDIA_NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      api_key_env: NVIDIA_API_KEY
      chat_model: ${NVIDIA_NIM_FALLBACK_MODEL:-minimaxai/minimax-m3.1-flash}
      structured_output: json_schema
      stream_always: true
      stall_timeout_s: 25
      timeout_s: 90
      verified: true
      notes: >-
        Second hosted NIM model on the same key, tried when the first fails or stalls.
        minimaxai/minimax-m3.1-flash was verified 2026-10-29 (strict JSON schema).

    nim-local:
      kind: nvidia_nim
      base_url: ${NIM_LOCAL_BASE_URL:-}
      allow_no_key: true
      chat_model: ${NIM_LOCAL_CHAT_MODEL:-}
      embedding_model: ${NIM_LOCAL_EMBED_MODEL:-}
      rerank_model: ${NIM_LOCAL_RERANK_MODEL:-}
      rerank_url: ${NIM_LOCAL_RERANK_URL:-}
      structured_output: guided_json
      verified: false
      notes: Self-hosted NIM containers started by the `nim` docker compose profile.

    azure:
      kind: azure_openai
      base_url: ${AZURE_OPENAI_ENDPOINT:-}
      api_key_env: AZURE_OPENAI_API_KEY
      azure_ad: ${AZURE_OPENAI_USE_ENTRA:-false}
      chat_model: ${AZURE_OPENAI_CHAT_DEPLOYMENT:-gpt-5.1}
      embedding_model: ${AZURE_OPENAI_EMBED_DEPLOYMENT:-text-embedding-3-small}
      structured_output: json_schema
      verified: false
      notes: >-
        Azure OpenAI v1 data-plane API (https://<resource>.openai.azure.com/openai/v1). Model
        fields are deployment names. GPT-4 is retired; Microsoft lists gpt-5.1 as the successor
        to gpt-4o. Set AZURE_OPENAI_USE_ENTRA=true to use managed identity instead of an API key.

    openai_compat:
      kind: openai_compatible
      base_url: ${OPENAI_BASE_URL:-}
      api_key_env: OPENAI_API_KEY
      chat_model: ${OPENAI_CHAT_MODEL:-}
      embedding_model: ${OPENAI_EMBED_MODEL:-}
      structured_output: json_schema
      verified: false
      notes: Any OpenAI-compatible endpoint (OpenAI, vLLM, Ollama, LM Studio).

    fake:
      kind: fake
      verified: true
      notes: Deterministic offline provider used by tests, evals and the demo.

    local:
      kind: local
      verified: true
      notes: Offline embeddings (TF-IDF + truncated SVD) fitted on the incident corpus.

budgets:
  max_tokens: 60000
  max_cost_usd: 0.50
  max_latency_s: 180
  max_steps: 80
  max_tool_calls: 40
  max_llm_calls: 16

guardrails:
  redact_pii: true
  pseudonymize_ips: true
  detect_injection: true
  safety_model: false
  max_line_chars: 2000
  max_lines: 20000

severity:
  alpha: 0.10

retrieval:
  k: 3
  candidates: 12
  widen_candidates: 40
  min_grade: 0.35
  max_attempts: 3

investigation:
  max_steps: 6
  max_hypotheses: 4

triggers:
  alert_group_window_s: 300
  # Periodic log scan (off at 0): tail these files and open a run on an error burst. Sources are
  # "system=path" pairs, e.g. ARIA_SCAN_SOURCES="hdfs=/var/log/hdfs.log,openssh=/var/log/auth.log".
  scan_interval_s: ${ARIA_SCAN_INTERVAL_S:-0}
  scan_min_burst_score: 3.0
  scan_window_lines: 2000
  scan_sources: ${ARIA_SCAN_SOURCES:-}
