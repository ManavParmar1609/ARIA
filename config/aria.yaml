# ARIA runtime configuration.
#
# Secrets never live in this file. Each provider names the environment variable holding its key;
# a provider without a key (or endpoint) is disabled and fallback chains skip it, ending at the
# deterministic `fake` provider so every path still works offline.
#
# Model IDs move quickly. `verified: true` means the default IDs answered live calls on the date
# in the notes; `verified: false` marks IDs not yet checked. `aria providers check` reads each
# provider's catalog, confirms the configured IDs and sends one tiny request.

llm:
  # The adjudicator has no fake fallback: without a real model, the conservative severity policy
  # decides (most severe class in the prediction set, flagged for review).
  # nim-local (a self-hosted NIM) leads every chain; it is skipped until NIM_LOCAL_BASE_URL is set.
  # The Gemini pool comes next: four models on the one GEMINI_API_KEY, each with limits of its
  # own. The investigator, the report writer and the severity choice lead with the quality model
  # (gemini); the critic, message drafts, Ask ARIA and the rest (the search's query rewrite)
  # lead with the lite models and Gemma, so the quality model's daily requests go where quality
  # matters. Hosted NIM, Claude and OpenAI follow, each skipped until its key is set. A provider
  # that fails, stalls or has no room left under its limits hands the call to the next.
  routing:
    adjudicator: [nim-local, gemini, gemini-lite, gemini-lite-2, gemma, nim, nim-fallback, claude, openai, azure, openai_compat]
    investigator: [nim-local, gemini, gemini-lite, gemini-lite-2, gemma, nim, nim-fallback, claude, openai, azure, openai_compat, fake]
    reporter: [nim-local, gemini, gemini-lite, gemini-lite-2, gemma, nim, nim-fallback, claude, openai, azure, openai_compat, fake]
    critic: [nim-local, gemini-lite, gemini-lite-2, gemma, gemini, nim, nim-fallback, claude, openai, azure, openai_compat, fake]
    comms: [nim-local, gemini-lite, gemini-lite-2, gemma, gemini, nim, nim-fallback, claude, openai, azure, openai_compat, fake]
    ask: [nim-local, gemini-lite, gemini-lite-2, gemma, gemini, nim, nim-fallback, claude, openai, azure, openai_compat, fake]
    default: [nim-local, gemini-lite, gemini-lite-2, gemma, gemini, nim, nim-fallback, claude, openai, azure, openai_compat, fake]
  embeddings: [nim, azure, local]
  rerank: [nim]
  safety: [nim]

  # Keeping each provider with `limits` inside them (src/aria/llm/quota.py). Each limit is cut by
  # `margin` (0.1 keeps a tenth spare). Every request is counted before it goes; a provider
  # without room is skipped for the next one, after waiting up to `max_wait_s` seconds for its
  # minute to free up. A model-written triage reserves the day's requests it needs across the
  # chains before it starts; when they do not fit, it runs offline and says until when. Daily
  # counts start again at midnight in `timezone`, Pacific time as Google's do. The counts and any
  # rest after a refusal are kept in llm-quota.json in ARIA_DATA_DIR (or ARIA_QUOTA_FILE), so a
  # restart remembers them; each process counts only its own requests, so run one per key.
  quota:
    margin: ${ARIA_QUOTA_MARGIN:-0.1}
    max_wait_s: 5
    reserve_runs: true
    reservation_ttl_s: 900
    timezone: America/Los_Angeles

  # Answers to repeats of a deterministic request (temperature 0: the severity choice, the
  # investigator's steps, the critic) are kept in memory this long, at most this many. Work done
  # with a visitor's own key is never kept. 0 turns it off.
  cache:
    ttl_s: 900
    max_entries: 256
  # A visitor's own key (the console's Settings page, or the X-Model-Provider and X-Model-Key
  # headers), off unless ARIA_VISITOR_KEYS=true, as in the public demo image. A key stands in for
  # this server's key in the providers listed for its kind, which then lead every chain, for the
  # run or question it came with only: it is held in memory while that work runs, and never
  # stored, logged or shown.
  visitor_keys:
    enabled: ${ARIA_VISITOR_KEYS:-false}
    providers:
      claude: [claude]
      gemini: [gemini, gemini-lite, gemini-lite-2, gemma]
      openai: [openai]
      nvidia: [nim, nim-fallback]

  # This server's own keys, for visitors who bring none: how many model-written runs and answers
  # each visitor (per_visitor) and everyone together (per_day) may have per UTC day; 0 means no
  # limit. Past either, the work runs offline, which still works end to end. A visitor's own key
  # never counts. Counts live in memory: a restart starts the day afresh. The public demo image
  # sets both (docs/deploy-free.md).
  shared:
    per_visitor: ${ARIA_SHARED_PER_VISITOR:-0}
    per_day: ${ARIA_SHARED_PER_DAY:-0}

  providers:
    nim-local:
      kind: nvidia_nim
      base_url: ${NIM_LOCAL_BASE_URL:-}
      allow_no_key: true
      chat_model: ${NIM_LOCAL_CHAT_MODEL:-}
      embedding_model: ${NIM_LOCAL_EMBED_MODEL:-}
      rerank_model: ${NIM_LOCAL_RERANK_MODEL:-}
      rerank_url: ${NIM_LOCAL_RERANK_URL:-}
      structured_output: guided_json
      verified: false
      notes: Self-hosted NIM containers started by the `nim` docker compose profile.

    # --- The Gemini pool: four models on one GEMINI_API_KEY ----------------------------------
    # Google limits a project per model, in requests a minute (rpm), input tokens a minute (tpm)
    # and requests a day (rpd), and starts the daily count again at midnight Pacific time: that
    # is what Google's Gemini rate-limits page (ai.google.dev/gemini-api/docs/rate-limits) said
    # when it was read on 2026-10-31, from a search extract (this project's research notes;
    # the page itself could not be fetched). The page does not list each model's numbers: they
    # show only in AI Studio, on the rate-limit page of the project behind your key, and they
    # differ by tier (free, or billing enabled). So the defaults below are cautious
    # placeholders, set at or under the lowest free-tier figures reported in 2026 (a Flash model
    # at 20 requests a day), not Google's numbers for these models. Copy yours from AI Studio
    # into the variables named here: GEMINI_RPM, GEMINI_TPM, GEMINI_RPD for gemini, and the same
    # with GEMINI_LITE_, GEMINI_LITE_2_ and GEMMA_ in front for the others. "none" lifts a limit;
    # 0 means the model has no quota, so it is never called. ARIA counts the tokens a reply may
    # use as well as the prompt's, to err on the safe side. Routing across these models spreads
    # the load within each one's own limits; never add keys or projects to multiply them, which
    # Google's terms forbid.
    gemini:
      kind: openai_compatible
      base_url: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      api_key_env: [GEMINI_API_KEY, gemini_api_key]
      chat_model: ${GEMINI_CHAT_MODEL:-gemini-3.6-flash}
      reasoning_effort: ${GEMINI_REASONING_EFFORT:-minimal}
      structured_output: json_schema
      stream_always: true
      stall_timeout_s: 25
      timeout_s: 90
      limits:
        rpm: ${GEMINI_RPM:-5}
        tpm: ${GEMINI_TPM:-100000}
        rpd: ${GEMINI_RPD:-20}
      verified: true
      notes: >-
        Google's Gemini API through its OpenAI-compatible endpoint (key from aistudio.google.com).
        Verified 2026-10-30 with live calls: gemini-3.6-flash answered streamed and plain requests,
        filled ARIA's report schema in strict json_schema mode and wrote a full triage's report;
        gemini-lite took the calls it answered with 503 or 429. Thinking tokens count against
        max_tokens, so reasoning is minimal by default (low spent most of a 64-token reply on
        thinking). gemini-3.8-flash is listed but answered HTTP 503 (high demand) that day. On
        the free tier, Google may use prompts to improve its products and its daily limits are
        shown only in AI Studio; ARIA sends only redacted, fenced evidence, but use a paid key,
        a self-hosted NIM or the offline mode where that is not acceptable.

    gemini-lite:
      kind: openai_compatible
      base_url: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      api_key_env: [GEMINI_API_KEY, gemini_api_key]
      chat_model: ${GEMINI_LITE_MODEL:-gemini-3.5-flash-lite}
      reasoning_effort: ${GEMINI_REASONING_EFFORT:-minimal}
      structured_output: json_schema
      stream_always: true
      stall_timeout_s: 25
      timeout_s: 90
      limits:  # placeholders: copy this model's numbers from AI Studio (see the pool's note)
        rpm: ${GEMINI_LITE_RPM:-10}
        tpm: ${GEMINI_LITE_TPM:-100000}
        rpd: ${GEMINI_LITE_RPD:-20}
      verified: true
      notes: >-
        A lighter Gemini model on the same key, with limits of its own. It leads the critic, the
        message drafts and Ask ARIA, and takes the other roles' calls when gemini fails, stalls
        or has no room. gemini-3.5-flash-lite was verified 2026-10-30 (streaming, strict
        json_schema with ARIA's report schema).

    gemini-lite-2:
      kind: openai_compatible
      base_url: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      api_key_env: [GEMINI_API_KEY, gemini_api_key]
      chat_model: ${GEMINI_LITE_2_MODEL:-gemini-3.1-flash-lite}
      reasoning_effort: ${GEMINI_REASONING_EFFORT:-minimal}
      structured_output: json_schema
      stream_always: true
      stall_timeout_s: 25
      timeout_s: 90
      limits:  # placeholders: copy this model's numbers from AI Studio (see the pool's note)
        rpm: ${GEMINI_LITE_2_RPM:-10}
        tpm: ${GEMINI_LITE_2_TPM:-100000}
        rpd: ${GEMINI_LITE_2_RPD:-20}
      verified: false
      notes: >-
        A second lite model on the same key, with limits of its own, so a busy day spreads over
        one more model. gemini-3.1-flash-lite is listed on Google's pricing page with a free tier
        (read 2026-10-31) but has not been called from ARIA, so it is unverified: run `aria
        providers check gemini-lite-2` before relying on it. Set GEMINI_LITE_2_MODEL to use
        another.

    gemma:
      kind: openai_compatible
      base_url: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      api_key_env: [GEMINI_API_KEY, gemini_api_key]
      chat_model: ${GEMMA_MODEL:-gemma-3-27b-it}
      # Whether Gemma takes a JSON schema, a JSON mode or a system role through this endpoint is
      # unverified, so it is asked the plain way: the schema in the prompt, its JSON pulled out
      # of the reply and checked, with one repair; and the instructions folded into the first
      # user message. No reasoning effort: Gemma does not think first.
      structured_output: prompt
      system_messages: merge
      stream_always: true
      stall_timeout_s: 25
      timeout_s: 90
      limits:  # placeholders: copy this model's numbers from AI Studio (see the pool's note)
        rpm: ${GEMMA_RPM:-15}
        tpm: ${GEMMA_TPM:-12000}
        rpd: ${GEMMA_RPD:-500}
      verified: false
      notes: >-
        Google's open Gemma model, served on the same key with limits of its own: the pool's
        last stop before other providers. gemma-3-27b-it has not been called from ARIA, so its
        ID, its structured output and its system-role handling are unverified: run `aria
        providers check gemma` first. Set GEMMA_MODEL to use another Gemma.

    nim:
      kind: nvidia_nim
      base_url: ${NVIDIA_NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      api_key_env: NVIDIA_API_KEY
      public_catalog: true
      chat_model: ${NVIDIA_NIM_CHAT_MODEL:-openai/gpt-oss-20b}
      reasoning_effort: ${NVIDIA_NIM_REASONING_EFFORT:-low}
      embedding_model: ${NVIDIA_NIM_EMBED_MODEL:-nvidia/nemotron-3.5-embed-1b}
      rerank_model: ${NVIDIA_NIM_RERANK_MODEL:-}
      rerank_url: ${NVIDIA_NIM_RERANK_URL:-}
      safety_model: ${NVIDIA_NIM_SAFETY_MODEL:-nvidia/nemotron-3.5-content-safety}
      structured_output: json_schema
      stream_always: true
      stall_timeout_s: 25
      timeout_s: 90
      verified: true
      notes: >-
        Hosted NVIDIA NIM (build.nvidia.com), OpenAI-compatible. Verified 2026-10-29 with live
        calls: openai/gpt-oss-20b (strict JSON schema, streaming) and nvidia/nemotron-3.5-embed-1b
        (2048-dim, input_type=query|passage). z-ai/glm-5.3-flash is listed but did not answer
        within 100 s that day. nvidia/nemotron-3.5-content-safety (the optional guardrail, off by
        default) is listed in the model catalog (checked 2026-10-29) but has not been called live,
        so its verdict format is unverified. Reranking is off until NVIDIA_NIM_RERANK_MODEL and
        NVIDIA_NIM_RERANK_URL are set (the retrieval API runs on ai.api.nvidia.com). Set
        NVIDIA_NIM_BASE_URL to a self-hosted NIM (for example http://nim:8000/v1) to use your
        own GPUs.

    nim-fallback:
      kind: nvidia_nim
      base_url: ${NVIDIA_NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      api_key_env: NVIDIA_API_KEY
      public_catalog: true
      chat_model: ${NVIDIA_NIM_FALLBACK_MODEL:-minimaxai/minimax-m3.1-flash}
      structured_output: json_schema
      stream_always: true
      stall_timeout_s: 25
      timeout_s: 90
      verified: true
      notes: >-
        Second hosted NIM model on the same key, tried when the first fails or stalls.
        minimaxai/minimax-m3.1-flash was verified 2026-10-29 (strict JSON schema).

    azure:
      kind: azure_openai
      base_url: ${AZURE_OPENAI_ENDPOINT:-}
      api_key_env: AZURE_OPENAI_API_KEY
      azure_ad: ${AZURE_OPENAI_USE_ENTRA:-false}
      chat_model: ${AZURE_OPENAI_CHAT_DEPLOYMENT:-gpt-5.1}
      embedding_model: ${AZURE_OPENAI_EMBED_DEPLOYMENT:-text-embedding-3-small}
      structured_output: json_schema
      verified: false
      notes: >-
        Azure OpenAI v1 data-plane API (https://<resource>.openai.azure.com/openai/v1). Model
        fields are deployment names. GPT-4 is retired; Microsoft lists gpt-5.1 as the successor
        to gpt-4o. Set AZURE_OPENAI_USE_ENTRA=true to use managed identity instead of an API key.

    claude:
      kind: anthropic
      base_url: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      api_key_env: ANTHROPIC_API_KEY
      chat_model: ${ANTHROPIC_CHAT_MODEL:-claude-opus-5-5}
      reasoning_effort: ${ANTHROPIC_EFFORT:-low}
      # Claude always thinks a little first, and the thinking counts against each reply's limit.
      reasoning_tokens: 4000
      structured_output: json_schema
      stream_always: true
      stall_timeout_s: 30
      timeout_s: 120
      price_input_per_mtok: 4.0
      price_output_per_mtok: 20.0
      # A request a safety classifier declines is run again on a model Anthropic picks for it.
      # Remove both lines for a model that has no server-side fallback (Claude Haiku).
      extra_headers: {anthropic-beta: server-side-fallback-2026-07-01}
      extra_body: {fallbacks: default}
      verified: false
      notes: >-
        Claude through Anthropic's own Python SDK and the Messages API: the system prompt apart
        from the turns, schema-constrained JSON through output_config.format, depth through
        output_config.effort, and no temperature (current Claude models refuse it).
        claude-opus-5-5 is Anthropic's default model ($4 and $20 per million input and output
        tokens on 2026-10-30); set ANTHROPIC_CHAT_MODEL to choose another. Not yet called live
        from ARIA, so unverified.

    openai:
      kind: openai_compatible
      base_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY
      chat_model: ${OPENAI_CHAT_MODEL:-gpt-6.1-sol}
      reasoning_effort: ${OPENAI_REASONING_EFFORT:-low}
      max_tokens_field: max_completion_tokens
      sampling: false
      reasoning_tokens: 4000
      structured_output: json_schema
      stream_always: true
      stall_timeout_s: 30
      timeout_s: 120
      price_input_per_mtok: 2.0
      price_output_per_mtok: 10.0
      verified: false
      notes: >-
        OpenAI's own API through Chat Completions. gpt-6.1-sol is OpenAI's model for balancing
        capability and cost ($2 and $10 per million input and output tokens on 2026-10-30); it
        takes Chat Completions with strict json_schema and streaming, reasoning effort low or
        above, max_completion_tokens instead of max_tokens, and no temperature while it reasons.
        Not yet called live from ARIA, so unverified.

    openai_compat:
      kind: openai_compatible
      base_url: ${OPENAI_COMPAT_BASE_URL:-}
      api_key_env: OPENAI_COMPAT_API_KEY
      chat_model: ${OPENAI_COMPAT_CHAT_MODEL:-}
      embedding_model: ${OPENAI_COMPAT_EMBED_MODEL:-}
      structured_output: json_schema
      verified: false
      notes: Any other OpenAI-compatible endpoint (vLLM, Ollama, LM Studio).

    fake:
      kind: fake
      verified: true
      notes: Deterministic offline provider used by tests, evals and the demo.

    local:
      kind: local
      verified: true
      notes: Offline embeddings (TF-IDF + truncated SVD) fitted on the incident corpus.

budgets:
  max_tokens: 60000
  max_cost_usd: 0.50
  max_latency_s: 180
  max_steps: 80
  max_tool_calls: 40
  max_llm_calls: 16

guardrails:
  redact_pii: true
  pseudonymize_ips: true
  detect_injection: true
  safety_model: false
  max_line_chars: 2000
  max_lines: 20000

severity:
  alpha: 0.10
  serious_alpha: 0.05
  severe_miss_risk: 0.05

retrieval:
  k: 3
  candidates: 12
  widen_candidates: 40
  min_grade: 0.35
  max_attempts: 3

investigation:
  max_steps: 6
  max_hypotheses: 4

# Message drafts. A draft may link only to ARIA's own console and API (the hosts of
# ARIA_CONSOLE_URL and ARIA_PUBLIC_BASE_URL, where reports and runbooks live) and to the hosts
# listed here, and may address only the recipients listed here (@handles, #channels or e-mail
# addresses), whoever wrote it: a model, a log line or an alert label. Anything else is taken out
# of the draft before review and listed for the reviewer. Both take comma-separated values.
comms:
  link_hosts: ${ARIA_DRAFT_LINK_HOSTS:-}
  recipients: ${ARIA_DRAFT_RECIPIENTS:-}

triggers:
  alert_group_window_s: 300
  # Periodic log scan (off at 0): tail these files and open a run on an error burst. Sources are
  # "system=path" pairs, e.g. ARIA_SCAN_SOURCES="hdfs=/var/log/hdfs.log,openssh=/var/log/auth.log".
  scan_interval_s: ${ARIA_SCAN_INTERVAL_S:-0}
  scan_min_burst_score: 3.0
  scan_window_lines: 2000
  scan_sources: ${ARIA_SCAN_SOURCES:-}
