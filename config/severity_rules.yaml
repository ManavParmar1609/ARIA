# ARIA severity rules.
#
# Rules read only what ARIA computes from the log window (counts, rates, spread, keyword
# categories, component criticality) plus firing alerts. They never see dataset labels or BGL
# alert tags, so scoring them against those labels is not circular. Lines quarantined as
# possible prompt injection are excluded before features are computed, so they cannot move a
# score.
#
# effect: score  adds `weight` to `severity`'s score. The rule severity is the most severe class
#                whose score reaches its `activation` threshold (below), so one decisive SEV1
#                rule is not outvoted by the weaker SEV2 rules a severe incident also trips.
#                Noise (SEV4) rules can outvote SEV3-level signals only.
# effect: floor  the final severity can never be less severe than `severity`.
#
# dimensions     the kinds of impact a SEV1 rule shows: availability, integrity, security, spread,
#                criticality, persistence or alerting. The rules call SEV1 only when the SEV1
#                rules that fired name at least `sev1_dimensions` of them between them, as an
#                impact-by-urgency matrix would; otherwise their weight counts towards SEV2. A
#                rule that decides SEV1 on its own must name that many itself (checked at load).
#
# Conditions are {feature, op, value}, combined with all: [...] or any: [...] and nested freely.
# Features: every numeric WindowFeatures field, level_counts.<LEVEL>, keyword_hits.<category>
# (see config/lexicon.yaml), issue_keyword_hits.<category> (the same, on lines at WARN or above
# or with no level), n_critical_components, alerts.firing, alerts.critical and alerts.warning.
# Unknown feature names fail at load time.

version: "2026.11.2"

# A severity is decided without the LLM only when the prediction set is a single class and the
# calibrated model gives it at least this probability.
gate:
  auto_confidence: 0.85

# Summed weight a class needs before the rules call it. A single strong SEV1 rule (weight 2.5+)
# is decisive; weaker signals need corroboration.
activation:
  SEV1: 2.5
  SEV2: 2.0
  SEV3: 1.0

# Impact dimensions SEV1 needs, between the SEV1 rules that fired.
sev1_dimensions: 2

rules:
  # --- SEV1: widespread outage or data-loss risk ------------------------------------------------
  - id: crash_widespread
    title: Crash signatures on four or more nodes
    effect: score
    severity: SEV1
    weight: 3.0
    dimensions: [availability, spread]
    when:
      all:
        - {feature: keyword_hits.crash, op: ">=", value: 10}
        - {feature: error_nodes, op: ">=", value: 4}

  - id: critical_component_widespread
    title: A critical component is failing on eight or more nodes
    effect: score
    severity: SEV1
    weight: 2.5
    dimensions: [criticality, spread]
    when:
      all:
        - {feature: max_component_criticality, op: ">=", value: 0.9}
        - {feature: error_nodes, op: ">=", value: 8}

  - id: error_storm
    title: Error storm across most of the fleet
    effect: score
    severity: SEV1
    weight: 2.5
    dimensions: [availability, spread]
    when:
      all:
        - {feature: peak_errors_per_min, op: ">=", value: 100}
        - {feature: node_spread, op: ">=", value: 0.5}
        - {feature: error_nodes, op: ">=", value: 4}

  - id: hardware_failure_widespread
    title: Hardware or power faults on several nodes
    effect: score
    severity: SEV1
    weight: 2.5
    dimensions: [availability, spread, criticality]
    when:
      all:
        - {feature: keyword_hits.hardware, op: ">=", value: 10}
        - {feature: error_nodes, op: ">=", value: 3}
        - {feature: max_component_criticality, op: ">=", value: 0.8}

  - id: critical_alert_firing
    title: A monitoring alert labelled critical is firing
    effect: score
    severity: SEV1
    weight: 1.5
    dimensions: [alerting]
    when: {feature: alerts.critical, op: ">=", value: 1}

  # --- SEV2: major degradation or a failing critical component ---------------------------------
  # A crash word in a routine INFO line (a speculative task attempt "aborted", a process
  # "killed" on schedule) is usually not a crash: only lines at WARN or above, or with no level,
  # are decisive. Routine mentions still count, as moderate.
  - id: crash_signature
    title: Crash signatures (panic, segfault, abort, kernel terminated) in warnings or errors
    effect: score
    severity: SEV2
    weight: 2.0
    when: {feature: issue_keyword_hits.crash, op: ">=", value: 1}

  - id: crash_words_routine
    title: Crash words in routine lines
    effect: score
    severity: SEV3
    weight: 1.0
    when:
      all:
        - {feature: keyword_hits.crash, op: ">=", value: 1}
        - {feature: issue_keyword_hits.crash, op: "==", value: 0}

  - id: critical_component_errors
    title: Errors from a critical component
    effect: score
    severity: SEV2
    weight: 2.0
    when:
      all:
        - {feature: max_component_criticality, op: ">=", value: 0.8}
        - {feature: error_events, op: ">=", value: 5}

  - id: errors_spread
    title: Errors on eight or more nodes
    effect: score
    severity: SEV2
    weight: 1.5
    when: {feature: error_nodes, op: ">=", value: 8}

  - id: sustained_burst
    title: Sustained error burst well above baseline
    effect: score
    severity: SEV2
    weight: 1.5
    when:
      all:
        - {feature: burst_score, op: ">=", value: 5}
        - {feature: error_events, op: ">=", value: 50}

  - id: unavailability_widespread
    title: Services unreachable from several nodes
    effect: score
    severity: SEV2
    weight: 1.5
    when:
      all:
        - {feature: keyword_hits.unavailable, op: ">=", value: 20}
        - {feature: error_nodes, op: ">=", value: 3}

  - id: unavailability_reported
    title: A service reported unreachable in warnings or errors, three or more times
    effect: score
    severity: SEV2
    weight: 2.0
    when: {feature: issue_keyword_hits.unavailable, op: ">=", value: 3}

  - id: storage_failures
    title: Storage or file-system failures
    effect: score
    severity: SEV2
    weight: 1.0
    when:
      all:
        - {feature: keyword_hits.storage, op: ">=", value: 3}
        - {feature: error_events, op: ">=", value: 3}

  - id: unfinished_work_widespread
    title: One in twenty units of work or more broke off partway
    effect: score
    severity: SEV2
    weight: 2.0
    when:
      all:
        - {feature: broken_flows, op: ">=", value: 20}
        - {feature: broken_flow_ratio, op: ">=", value: 0.05}

  - id: attack_widespread
    title: Authentication attacks against six or more hosts
    effect: score
    severity: SEV2
    weight: 1.5
    when:
      all:
        - {feature: keyword_hits.security, op: ">=", value: 30}
        - {feature: distinct_nodes, op: ">=", value: 6}

  - id: warning_alert_firing
    title: A monitoring alert labelled warning is firing
    effect: score
    severity: SEV2
    weight: 0.5
    when: {feature: alerts.warning, op: ">=", value: 1}

  # --- SEV3: contained errors ------------------------------------------------------------------
  - id: errors_present
    title: Error-level events in the window
    effect: score
    severity: SEV3
    weight: 1.0
    when: {feature: error_events, op: ">=", value: 3}

  - id: novel_error_template
    title: An error message ARIA has not seen before
    effect: score
    severity: SEV3
    weight: 1.0
    when: {feature: novel_error_templates, op: ">=", value: 1}

  - id: degradation_signs
    title: Retries, timeouts or degradation messages
    effect: score
    severity: SEV3
    weight: 1.0
    when:
      any:
        - {feature: keyword_hits.degradation, op: ">=", value: 5}
        - {feature: keyword_hits.network, op: ">=", value: 5}

  - id: security_attempts
    title: Repeated authentication failures
    effect: score
    severity: SEV3
    weight: 1.0
    when: {feature: keyword_hits.security, op: ">=", value: 5}

  - id: unfinished_work
    title: Units of work (blocks, task attempts) that broke off partway
    effect: score
    severity: SEV3
    weight: 1.0
    when: {feature: broken_flows, op: ">=", value: 3}

  - id: persistent_errors
    title: Errors persisting for ten minutes or more
    effect: score
    severity: SEV3
    weight: 0.5
    when:
      all:
        - {feature: persistence_s, op: ">=", value: 600}
        - {feature: error_events, op: ">=", value: 10}

  # --- SEV4: noise -----------------------------------------------------------------------------
  # Work that silently breaks off logs no errors, so a quiet window is noise only when its
  # units of work also finished.
  - id: no_errors
    title: No error-level events, and units of work finish
    effect: score
    severity: SEV4
    weight: 2.0
    when:
      all:
        - {feature: error_events, op: "==", value: 0}
        - {feature: broken_flows, op: "<", value: 3}
        - {feature: issue_keyword_hits.unavailable, op: "<", value: 3}

  # A ratio says little about a handful of lines: "errors are rare" needs twenty events behind it.
  - id: low_error_rate
    title: Errors are rare and confined to low-criticality components
    effect: score
    severity: SEV4
    weight: 1.5
    when:
      all:
        - {feature: n_events, op: ">=", value: 20}
        - {feature: error_ratio, op: "<", value: 0.05}
        - {feature: max_component_criticality, op: "<", value: 0.5}
        - {feature: keyword_hits.crash, op: "==", value: 0}
        - {feature: broken_flows, op: "<", value: 3}

  # --- version 2 categories (config/lexicon.yaml names each one's sources) -----------------------
  # No Loghub system logs these, so their weights are judgement, kept below SEV2's activation:
  # each needs another SEV2 signal before the rules call SEV2 on its own.
  - id: tls_failures
    title: TLS or certificate failures, so clients cannot connect securely
    effect: score
    severity: SEV2
    weight: 1.5
    when: {feature: issue_keyword_hits.tls, op: ">=", value: 3}

  - id: dns_failures_spread
    title: Name-resolution failures on three or more nodes
    effect: score
    severity: SEV2
    weight: 1.5
    when:
      all:
        - {feature: issue_keyword_hits.dns, op: ">=", value: 5}
        - {feature: error_nodes, op: ">=", value: 3}

  - id: dns_failures
    title: Name-resolution failures
    effect: score
    severity: SEV3
    weight: 1.0
    when: {feature: issue_keyword_hits.dns, op: ">=", value: 5}

  - id: control_plane_failures
    title: The cluster's control plane is failing (leader lost, store full, API timing out)
    effect: score
    severity: SEV2
    weight: 1.5
    when: {feature: issue_keyword_hits.control_plane, op: ">=", value: 3}

  # A detector saying data is leaving, or a command-and-control channel, is a security incident
  # with data exposure (NIST SP 800-61's information impact), so it decides SEV2 on its own.
  - id: exfiltration_detected
    title: A detector reports data leaving the network, or a command-and-control channel
    effect: score
    severity: SEV2
    weight: 2.0
    when: {feature: issue_keyword_hits.exfiltration, op: ">=", value: 1}

  - id: recovery_inhibition_attack
    title: Backups deleted alongside security alerts, as ransomware prepares
    effect: score
    severity: SEV1
    weight: 2.5
    dimensions: [security, integrity]
    when:
      all:
        - {feature: keyword_hits.recovery_inhibition, op: ">=", value: 1}
        - {feature: keyword_hits.security, op: ">=", value: 1}

  - id: storage_fatal_spread
    title: Filesystems shutting down on two or more nodes
    effect: score
    severity: SEV2
    weight: 2.0
    when:
      all:
        - {feature: issue_keyword_hits.storage_fatal, op: ">=", value: 1}
        - {feature: error_nodes, op: ">=", value: 2}

  - id: hardware_fatal_spread
    title: Fatal hardware errors on two or more nodes
    effect: score
    severity: SEV2
    weight: 2.0
    when:
      all:
        - {feature: issue_keyword_hits.hardware_fatal, op: ">=", value: 1}
        - {feature: error_nodes, op: ">=", value: 2}

  - id: signin_outage
    title: Sign-in or identity services failing, so people cannot log in
    effect: score
    severity: SEV2
    weight: 1.5
    when: {feature: issue_keyword_hits.signin, op: ">=", value: 3}

  - id: stale_data
    title: Data reported stale, lagging or out of schema
    effect: score
    severity: SEV3
    weight: 1.0
    when: {feature: issue_keyword_hits.freshness, op: ">=", value: 3}

  # --- floors: severities ARIA must never go below ---------------------------------------------
  - id: data_risk_floor
    title: Data-integrity signals (corruption, data loss, missing blocks)
    effect: floor
    severity: SEV2
    when:
      all:
        - {feature: keyword_hits.data_risk, op: ">=", value: 1}
        - {feature: error_events, op: ">=", value: 1}

  - id: critical_crash_floor
    title: A critical component is crashing
    effect: floor
    severity: SEV2
    when:
      all:
        - {feature: keyword_hits.crash, op: ">=", value: 1}
        - {feature: max_component_criticality, op: ">=", value: 0.9}

  - id: critical_alert_floor
    title: A critical monitoring alert is firing
    effect: floor
    severity: SEV2
    when: {feature: alerts.critical, op: ">=", value: 1}

  # A failing power supply can take a node down with no other warning. Reported at warning level
  # or above, it is never rated below SEV2 (it once came out SEV3 on validation windows the
  # scenario policy rates SEV1 or SEV2).
  - id: power_fault_floor
    title: Power-supply faults reported as errors
    effect: floor
    severity: SEV2
    when:
      all:
        - {feature: issue_keyword_hits.power, op: ">=", value: 1}
        - {feature: error_events, op: ">=", value: 1}

  # Silent failures log no errors, so the model, trained on windows that do, can read them as
  # noise. Work that broke off partway always gets a person's look.
  - id: unfinished_work_floor
    title: Units of work broke off partway, with no error logged
    effect: floor
    severity: SEV3
    when: {feature: broken_flows, op: ">=", value: 3}

  # Money moved twice, or ledgers that disagree, is a data-integrity incident whatever else the
  # window shows.
  - id: payment_integrity_floor
    title: Payment integrity at risk (duplicate charges, ledger mismatches)
    effect: floor
    severity: SEV2
    when: {feature: issue_keyword_hits.payment, op: ">=", value: 1}

  # Deleting shadow copies or the backup catalog is how ransomware makes sure there is nothing to
  # restore (MITRE ATT&CK T1490). These commands show up as routine process events, so every line
  # counts. With security signals beside them they are an attack in progress (see
  # recovery_inhibition_attack).
  - id: recovery_inhibition_floor
    title: Commands that delete backups or shadow copies were run
    effect: floor
    severity: SEV2
    when: {feature: keyword_hits.recovery_inhibition, op: ">=", value: 1}

  # Backups that fail leave nothing to restore when the next incident comes (NIST SP 800-61;
  # GitLab.com's 2017 database outage). Someone should look, but nothing is down yet.
  - id: backups_failing_floor
    title: Backups, snapshots or restores failing
    effect: floor
    severity: SEV3
    when: {feature: issue_keyword_hits.backup, op: ">=", value: 1}

  # One more failure and the service is down (PagerDuty rates "no redundancy" above a single
  # failed node).
  - id: redundancy_lost_floor
    title: Redundancy is gone, so one more failure means an outage
    effect: floor
    severity: SEV3
    when: {feature: issue_keyword_hits.redundancy_lost, op: ">=", value: 1}

  # A filesystem that shut itself down, or a hardware event the firmware calls fatal, has lost a
  # node's function, unlike the generic words in storage and hardware.
  - id: storage_fatal_floor
    title: A filesystem shut itself down or went read-only after an error
    effect: floor
    severity: SEV3
    when: {feature: issue_keyword_hits.storage_fatal, op: ">=", value: 1}

  - id: hardware_fatal_floor
    title: Hardware reported a fatal error
    effect: floor
    severity: SEV3
    when: {feature: issue_keyword_hits.hardware_fatal, op: ">=", value: 1}
