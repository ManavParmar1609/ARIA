# Keyword categories counted in every window. Each pattern is a case-insensitive regex matched
# against redacted log messages; a message counts once per category. Each category is counted
# twice: on every line (keyword_hits, which the rules read) and on lines logged at WARN or above
# or with no level (issue_keyword_hits, which the severity model reads), because at INFO the same
# words are usually routine.
#
# Version 2 widens the vocabulary beyond the Loghub systems with code families that mean the same
# thing in any system, and names the source of each in `sources` below. Words a family uses in
# upper case with underscores (gRPC's DATA_LOSS) are matched lowercased, as every pattern is.

version: 2

categories:
  # "Software caused connection abort" is a dropped connection, not a crash.
  crash: "panic|segfault|segmentation fault|core dump|kernel terminated|fatal error|stopping execution|crash(ed)?|(?<!connection )abort(ed)?|crashloopbackoff|exited unexpectedly|terminated unexpectedly|unexpected(ly)? exit"
  # HPC's "inconsistent nodesets" status line is about cluster membership, not data.
  data_risk: "corrupt|data[_ ]loss|checksum|inconsistent(?! nodesets)|lost block|missing block|unrecoverable|uncorrectable|split[- ]brain"
  unavailable: "unavailable|unreachable|\\bdown\\b|no route|connection refused|timed? ?out|cannot open channel|error in contacting|not responding|connectionloss|connection loss|(lost|no) quorum|quorum (lost|loss)|deadline[_ ]exceeded|bad gateway|gateway time-?out|health ?check failed|readiness probe failed|liveness probe failed"
  resource: "out of memory|\\boom\\b|oomkilled|disk full|no space|quota exceeded|too many open files|resource busy|resource[_ ]exhausted|too[_ ]many[_ ]connections|database space exceeded|\\bnospace\\b|\\b(disk|memory)pressure\\b|under (disk|memory) pressure|(disk|memory) pressure (is )?(high|critical)|\\bevicted\\b"
  security: "failed password|authentication failure|authentication failed|invalid user|break-in|unauthori[sz]ed|permission denied|brute|privilege escalation|malware|ransom"
  hardware: "machine check|parity|\\becc\\b|psu|power supply|\\bfan\\b|temperature|link ?error|hardware|\\bmce\\b|\\bedac\\b"
  storage: "mount failed|i/o error|input/output error|lustre|filesystem|file system|\\bdisk\\b|storage interrupt|read-only file system|\\beio\\b"
  network: "packet|tree network|socket|connection reset|broken pipe|link has been severed|connection broken|disconnect|econnreset|epipe"
  # "lease" alone matched Hadoop's routine LeaseRenewer thread; only a lease that went wrong counts.
  degradation: "slow|latency|retry|retrying|backoff|throttl|degraded|lease (expired|recovery|lost|timed? ?out)|rate limit"
  # A power supply failing: a narrower subject than hardware, read by a safety floor.
  power: "\\bpsu\\b|power supply|power-supply|power fault"
  # --- new in version 2 -------------------------------------------------------------------------
  tls: "x509|certificate (has )?expired|certificate verify failed|(ssl|tls) handshake (failed|failure|error)|handshake failure|bad certificate|unknown (ca|certificate authority)|certificate is not (yet )?valid"
  dns: "nxdomain|servfail|no such host|name resolution|could not resolve|unable to resolve|temporary failure in name resolution|dns (lookup|query|resolution) (failed|error|timed? ?out)"
  control_plane: "etcdserver: (request timed out|no leader|mvcc: database space exceeded)|leader(ship)? (lost|changed)|lost leadership|not (the )?leader|apiserver (unavailable|timeout)|failed to (watch|list) "
  backup: "backup (failed|failure|error)|snapshot (failed|failure|error)|shadow cop(y|ies) (deleted|delete)|vssadmin delete|restore (failed|failure)|replication (broken|failed|stopped|error)"
  payment: "duplicate (charge|payment|transaction)|double[- ]charg|charged twice|idempotency (key )?(conflict|violation)|payment (failed|declined|error)|settlement (failed|mismatch)|ledger (mismatch|imbalance)|reconciliation (failed|mismatch)"
  # macOS logs "Request for stale data" routinely, so only data said to be stale, or lagging,
  # counts.
  freshness: "data (is |are )(too )?stale|stale replica|replication lag|lagging behind|schema (mismatch|drift)|unknown column|missing column|(deserializ|deserialis)\\w* (error|failed|failure)|freshness (check|sla) (failed|breach)"
  signin: "(login|sign[- ]?in|sso|identity provider|idp|oauth|token (service|endpoint)) (service )?(unavailable|down|error|timed? ?out)"

sources:
  crash: ["Linux kernel oops and panic messages", "Kubernetes container states (CrashLoopBackOff)"]
  data_risk: ["gRPC status codes: DATA_LOSS", "Linux EDAC: uncorrectable errors", "HDFS block reports"]
  unavailable:
    - "gRPC status codes: UNAVAILABLE, DEADLINE_EXCEEDED"
    - "HTTP 502, 503 and 504 (RFC 9110)"
    - "ZooKeeper KeeperException.Code: CONNECTIONLOSS"
    - "Kubernetes probe events: liveness and readiness probe failed"
  resource:
    - "gRPC status codes: RESOURCE_EXHAUSTED"
    - "PostgreSQL SQLSTATE 53300 too_many_connections"
    - "etcd error: mvcc: database space exceeded (NOSPACE alarm)"
    - "Kubernetes eviction reasons: OOMKilled, DiskPressure, MemoryPressure, Evicted"
    - "Linux errno: ENOSPC, ENOMEM, EMFILE"
  security: ["Linux PAM and OpenSSH authentication messages", "Sigma rule levels: high and critical"]
  hardware: ["Linux machine-check and EDAC messages"]
  storage: ["Linux errno: EIO, EROFS"]
  network: ["Linux errno: ECONNRESET, EPIPE"]
  degradation: ["gRPC retry and backoff guidance", "HTTP 429 rate limiting (RFC 6585)"]
  power: ["IPMI and BMC power-supply sensor events"]
  tls: ["X.509 (RFC 5280) validation failures", "TLS 1.3 handshake alerts (RFC 8446)"]
  dns: ["DNS response codes NXDOMAIN and SERVFAIL (RFC 1035, RFC 8914)", "getaddrinfo EAI_AGAIN"]
  control_plane: ["etcd server errors", "Kubernetes API server and leader-election messages"]
  backup: ["MITRE ATT&CK T1490 Inhibit System Recovery", "database replication status messages"]
  payment: ["Payment-provider idempotency and duplicate-charge errors", "ledger reconciliation reports"]
  freshness: ["Replication-lag and schema-drift messages in data pipelines"]
  signin: ["Identity-provider and OAuth 2.0 error responses (RFC 6749)"]
