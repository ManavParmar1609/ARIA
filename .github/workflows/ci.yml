name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"
  PYTHON_VERSION: "3.13"
  ARIA_ENV: test

jobs:
  python:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-extras
      - name: Lint and type-check
        run: make lint
      - name: Test (coverage gate 80%)
        run: make test
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14
          if-no-files-found: ignore

  eval:
    name: Evaluation gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-extras
      - name: Cache the Loghub 2k samples
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/raw/loghub-2k
          key: loghub-2k-${{ hashFiles('data/manifest.yaml') }}
      - name: Download the Loghub 2k samples (pinned commit)
        run: uv run aria data download --source loghub-2k
      - name: Smoke evaluation against config/eval_thresholds.yaml
        run: make eval-smoke
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-smoke
          path: reports/eval/
          retention-days: 30
          if-no-files-found: ignore

  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Enable pnpm (the version package.json pins)
        run: corepack enable && pnpm --version
      - name: Locate the pnpm store
        id: pnpm
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Known vulnerabilities in npm dependencies (high and critical fail)
        run: pnpm audit --audit-level high
      - name: Format, lint and type-check
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install the API (end-to-end tests run against it, offline)
        working-directory: .
        run: uv sync --locked
      - name: API schema, client types and quoted results match their sources
        run: |
          pnpm gen:api --refresh
          pnpm sync:data
          git diff --exit-code -- ../docs/openapi.json src/lib/api/schema.ts src/data
      - name: Build
        run: pnpm build
      - name: Install Chromium for Playwright and Lighthouse
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests, with axe checks for WCAG 2.2 AA
        run: pnpm test:e2e
      - name: Lighthouse bars (median of three runs per page)
        run: ./scripts/lighthouse-ci.sh
      - name: Upload test and Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-reports
          path: |
            web/playwright-report/
            web/test-results/
            web/lighthouse/
          retention-days: 14
          if-no-files-found: ignore

  audit:
    name: Dependency and workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-extras
      - name: Known vulnerabilities in Python dependencies
        run: uv run pip-audit --progress-spinner off --skip-editable
      - name: Lint workflows
        run: uv run actionlint
      - name: Audit workflows for security issues
        run: uv run zizmor --offline .github/workflows

  images:
    name: Images and compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: api
          tags: aria-api:dev
          load: true
          cache-from: type=gha,scope=aria
          cache-to: type=gha,scope=aria,mode=max
      - name: Build the worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: worker
          tags: aria-worker:dev
          load: true
          cache-from: type=gha,scope=aria
      - name: Build the web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          tags: aria-web:dev
          load: true
          cache-from: type=gha,scope=aria-web
          cache-to: type=gha,scope=aria-web,mode=max
      - name: Build the Azure variant (azure extra and ODBC Driver 18)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: api
          build-args: ARIA_EXTRAS=azure
          tags: aria-api:azure
          load: true
          cache-from: type=gha,scope=aria-azure
          cache-to: type=gha,scope=aria-azure,mode=max
      - name: Check the Azure variant can reach Azure SQL
        run: >-
          docker run --rm aria-api:azure python -c "import pyodbc, azure.identity;
          assert 'ODBC Driver 18 for SQL Server' in pyodbc.drivers(), pyodbc.drivers()"
      - name: Start the stack and wait until healthy
        run: docker compose up -d --no-build --wait --wait-timeout 420
      - name: Triage, review and publish one run, then read it through the web console
        run: ./scripts/compose-smoke.sh
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  infra:
    name: Bicep templates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Bicep
        run: az bicep install
      - name: Compile infra/main.bicep (warnings fail the build)
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null 2> bicep.log || { cat bicep.log; exit 1; }
          cat bicep.log
          if grep -qi "warning" bicep.log; then exit 1; fi
