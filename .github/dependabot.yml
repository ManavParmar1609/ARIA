version: 2
# Only ecosystems whose manifests exist are listed: Dependabot fails a run for a directory with
# nothing to update. The npm entries (web/, video/) are added in the commits that create them.
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
