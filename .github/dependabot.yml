version: 2
# Only ecosystems whose manifests exist are listed: Dependabot fails a run for a directory with
# nothing to update. The video/ npm entry is added in the commit that creates it.
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    # Matches pnpm's minimumReleaseAge: never propose a version published less than a week ago.
    cooldown:
      default-days: 7
    groups:
      web:
        patterns: ["*"]
