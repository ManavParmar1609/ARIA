version: 2
# Only ecosystems whose manifests exist are listed: Dependabot fails a run for a directory with
# nothing to update. The npm (web/, video/), docker (docker/) and github-actions entries are
# added in the commits that create those directories.
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
