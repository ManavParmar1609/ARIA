# Single-package workspace: this file only carries pnpm settings.
packages:
  - "."

# Supply-chain guard: never resolve a version published less than a week ago.
minimumReleaseAge: 10080

# pnpm runs no dependency install scripts unless listed here.
onlyBuiltDependencies: []

# Security fixes for transitive dependencies. @ag-ui/client pins zod 3, which GHSA-mrhx-c7xc-m3w5
# affects (memory exhaustion on oversized collections); it imports zod/v4, which zod 4 provides.
overrides:
  zod: ^4.6.7
